name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: bio3d
          cache-environment: true

      - name: Install build tools
        shell: bash -el {0}
        run: pip install -e ".[dev]"

      - name: Verify release tag
        shell: bash -el {0}
        run: |
          version="$(python -c 'import topoppi; print(topoppi.__version__)')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${version}." >&2
            exit 1
          fi

      - name: Build clean distributions
        shell: bash -el {0}
        run: |
          rm -rf dist build src/*.egg-info
          python -m build
          python -m twine check dist/*
          if tar -tzf dist/*.tar.gz | grep -E 'tools/OptCuts/(OptCuts_bin|libigl_stb_image)|tests/fixtures/.*(_cutoff|\.topoppi\.json)'; then
            echo "Generated fixture output or OptCuts binary leaked into sdist." >&2
            exit 1
          fi

      - name: Prepare OptCuts release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash -el {0}
        run: |
          mkdir -p release-assets
          install -m 755 tools/OptCuts/OptCuts_bin release-assets/OptCuts_bin-linux-x86_64
          install -m 755 tools/OptCuts/libigl_stb_image.so release-assets/libigl_stb_image-linux-x86_64.so
          if [ -f tools/OptCuts/OptCuts_bin-windows-x86_64.exe ]; then
            install -m 755 tools/OptCuts/OptCuts_bin-windows-x86_64.exe release-assets/OptCuts_bin-windows-x86_64.exe
          fi
          (
            cd release-assets
            sha256sum * > SHA256SUMS
            while IFS= read -r asset; do
              sha256sum "$asset" > "${asset}.sha256"
            done < <(find . -maxdepth 1 -type f ! -name '*.sha256' ! -name 'SHA256SUMS' -printf '%f\n' | sort)
          )

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
          files: |
            release-assets/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
