name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify release metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(PYTHONPATH=src python -c 'from topoppi._version import __version__; print(__version__)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ (a|b|rc)[0-9]*$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$version." >&2
            exit 1
          fi

  linux:
    needs: metadata
    uses: ./.github/workflows/ci.yml
    with:
      release_artifacts: true

  windows:
    needs: metadata
    uses: ./.github/workflows/windows-installer.yml

  macos:
    needs: metadata
    uses: ./.github/workflows/macos-app.yml

  assemble:
    needs:
      - metadata
      - linux
      - windows
      - macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-linux
          path: incoming/linux

      - uses: actions/download-artifact@v8
        with:
          name: release-windows
          path: incoming/windows

      - uses: actions/download-artifact@v8
        with:
          name: release-macos-arm64
          path: incoming/macos-arm64

      - uses: actions/download-artifact@v8
        with:
          name: release-macos-x86_64
          path: incoming/macos-x86_64

      - name: Assemble and verify the release bundle
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          expected = {
              f"linux/topoppi-{version}-py3-none-any.whl",
              f"linux/topoppi-{version}.tar.gz",
              "linux/OptCuts_bin-linux-x86_64",
              "linux/TopoPPI-LICENSE.txt",
              "linux/OptCuts-LICENSE.txt",
              "linux/OptCuts-NOTICE.md",
              "linux/OptCuts-THIRD-PARTY-LICENSES.txt",
              f"windows/TopoPPI-{version}-windows-x86_64-setup.exe",
              "windows/OptCuts_bin-windows-x86_64.exe",
              "windows/OptCuts_bin-windows-x86_64.exe.sha256",
              f"macos-arm64/TopoPPI-{version}-macos-arm64.dmg",
              f"macos-x86_64/TopoPPI-{version}-macos-x86_64.dmg",
          }
          incoming = Path("incoming")
          actual = {
              path.relative_to(incoming).as_posix()
              for path in incoming.rglob("*")
              if path.is_file()
          }
          if actual != expected:
              missing = sorted(expected - actual)
              extra = sorted(actual - expected)
              raise SystemExit(f"Release artifact mismatch; missing={missing}, extra={extra}")

          output = Path("release-assets")
          output.mkdir()
          for relative in sorted(expected):
              source = incoming / relative
              target = output / source.name
              if target.exists():
                  raise SystemExit(f"Duplicate release filename: {target.name}")
              target.write_bytes(source.read_bytes())

          PY
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

  draft_release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - metadata
      - assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.metadata.outputs.version }}
      PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: release-assets

      - name: Create or update a draft release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .draft)"
            if [[ "$is_draft" != true ]]; then
              echo "Release $TAG is already public." >&2
              exit 1
            fi
          else
            args=("$TAG" --verify-tag --draft --generate-notes --title "TopoPPI $VERSION")
            if [[ "$PRERELEASE" == true ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          gh release upload "$TAG" --clobber "${assets[@]}"

  pypi:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - metadata
      - assemble
      - draft_release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: release-assets

      - name: Select Python distributions
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir pypi-dist
          install -m 644 "release-assets/topoppi-${VERSION}-py3-none-any.whl" pypi-dist/
          install -m 644 "release-assets/topoppi-${VERSION}.tar.gz" pypi-dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: pypi-dist/
          skip-existing: true

  verify_pypi:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - metadata
      - assemble
      - pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: release-assets

      - name: Match PyPI files to the assembled bundle
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = os.environ["VERSION"]
          expected = {}
          for name in (f"topoppi-{version}-py3-none-any.whl", f"topoppi-{version}.tar.gz"):
              content = Path("release-assets", name).read_bytes()
              expected[name] = hashlib.sha256(content).hexdigest()

          url = f"https://pypi.org/pypi/topoppi/{version}/json"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code != 404 or attempt == 11:
                      raise
              else:
                  actual = {
                      item["filename"]: item["digests"]["sha256"]
                      for item in payload["urls"]
                  }
                  if all(actual.get(name) == digest for name, digest in expected.items()):
                      break
                  if attempt == 11:
                      raise SystemExit(f"PyPI digest mismatch: expected={expected}, actual={actual}")
              time.sleep(10)
          PY

  publish_release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - metadata
      - draft_release
      - verify_pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Publish the verified GitHub release
        shell: bash
        run: gh release edit "$TAG" --draft=false --latest
