name: Windows cache path probe

on:
  push:
    branches:
      - codex/v2.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install and repair through Windows PowerShell
        shell: pwsh
        run: |
          $sourceRoot = (Get-Location).Path
          $installDir = Join-Path $env:RUNNER_TEMP "TopoPPI 用户"
          $assets = Join-Path $installDir "installer\assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          Invoke-WebRequest -Uri "https://github.com/GeraltZeroZhong/TopoPPI/releases/download/v1.3/OptCuts_bin-windows-x86_64.exe" -OutFile (Join-Path $assets "OptCuts_bin-windows-x86_64.exe")
          $powershell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $bootstrap = Join-Path $sourceRoot "installer\windows\install_topoppi.ps1"
          Push-Location $installDir
          try {
            foreach ($phase in @("Install", "Repair")) {
              Write-Host $phase
              & $powershell -NoProfile -ExecutionPolicy Bypass -File $bootstrap -InstallDir $installDir -PackageSpec $sourceRoot
              if ($LASTEXITCODE -ne 0) { throw "$phase failed." }
            }
          }
          finally {
            Pop-Location
          }
          if (@(& subst.exe).Count -ne 0) { throw "Setup retained a cache mapping." }
          $env:PYTHONUTF8 = "1"
          $python = Join-Path $installDir "env\python.exe"
          & $python -c "import MDAnalysis, igl, prolif, rdkit, topoppi; print(topoppi.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "The installed application could not import." }
          & (Join-Path $installDir "env\Scripts\pip.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "The installed pip launcher failed." }
          & (Join-Path $installDir "TopoPPI CLI.cmd") --version
          if ($LASTEXITCODE -ne 0) { throw "The installed TopoPPI launcher failed." }
