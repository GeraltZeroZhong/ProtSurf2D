name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: bio3d
          cache-environment: true

      - name: Install package
        shell: bash -el {0}
        run: pip install -e ".[dev,benchmark,interactions,meshio]"

      - name: Run tests
        shell: bash -el {0}
        run: python -m unittest discover -s tests

      - name: Import and CLI smoke
        shell: bash -el {0}
        run: |
          python -c "import topoppi; print(topoppi.__version__)"
          python -m topoppi.cli --help

      - name: Build package
        shell: bash -el {0}
        run: |
          python -m build
          twine check dist/*
