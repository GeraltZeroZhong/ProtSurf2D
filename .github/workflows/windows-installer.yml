name: Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $version = python -c "from topoppi._version import __version__; print(__version__)"
          "value=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows OptCuts artifact
        shell: pwsh
        run: |
          .\tools\OptCuts\build_windows_optcuts.ps1 -OutputDir "installer\windows" -SkipSmoke
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item installer\windows\OptCuts_bin-windows-x86_64.exe release-assets\
          Copy-Item installer\windows\OptCuts_bin-windows-x86_64.exe.sha256 release-assets\

      - name: Build setup executable
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $packageSpec = "https://github.com/GeraltZeroZhong/TopoPPI/archive/refs/tags/$env:GITHUB_REF_NAME.zip"
          }
          else {
            $packageSpec = "https://github.com/GeraltZeroZhong/TopoPPI/archive/$env:GITHUB_SHA.zip"
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          Push-Location installer\windows
          try {
            & $iscc "/DMyAppVersion=${{ steps.version.outputs.value }}" "/DMyPackageSpec=$packageSpec" "TopoPPI.iss"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          finally {
            Pop-Location
          }

      - name: Hash setup executable
        id: artifact
        shell: pwsh
        run: |
          $installer = "installer\windows\Output\TopoPPI-${{ steps.version.outputs.value }}-windows-x86_64-setup.exe"
          if (!(Test-Path $installer)) {
            throw "Installer not found: $installer"
          }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $installer -Leaf)" | Set-Content "$installer.sha256" -Encoding ascii
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "checksum=$installer.sha256" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TopoPPI-${{ steps.version.outputs.value }}-windows-x86_64-setup
          path: |
            ${{ steps.artifact.outputs.installer }}
            ${{ steps.artifact.outputs.checksum }}
            release-assets/OptCuts_bin-windows-x86_64.exe
            release-assets/OptCuts_bin-windows-x86_64.exe.sha256

      - name: Attach setup executable to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifact.outputs.installer }}
            ${{ steps.artifact.outputs.checksum }}
            release-assets/OptCuts_bin-windows-x86_64.exe
            release-assets/OptCuts_bin-windows-x86_64.exe.sha256
